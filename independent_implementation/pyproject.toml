[project]
name = "post-training-core"
version = "0.1.0"
description = "Independent implementations of post-training core computations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.6.0",
    "datasets==3.6.0",
    "hf-xet>=1.1,<2",
    "numpy>=1.26,<2.3",
    "pyyaml>=6.0,<7",
    "torch==2.6.0",
    "transformers==4.52.3",
    "xxhash==3.4.1",
]

[project.scripts]
sft-train = "post_training_core.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "trl==0.18.0",
]

[tool.pytest.ini_options]
addopts = ["-q", "-m", "not integration"]
markers = [
    "integration: tests that load pinned external artifacts",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
